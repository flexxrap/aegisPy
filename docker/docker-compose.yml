version: '3.8'

services:
  aegispy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: aegispy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import aegispy; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  aegispy-slim:
    build:
      context: .
      dockerfile: docker/Dockerfile.slim
    container_name: aegispy-slim
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
