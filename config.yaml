# AegisPy Configuration File
# This file configures the secure sandbox environment

# Sandbox settings
sandbox:
  timeout: 30.0                    # Maximum execution time in seconds
  max_memory_mb: 512               # Maximum memory in MB
  max_cpu_time: 30                 # Maximum CPU time in seconds
  max_file_size_mb: 10             # Maximum file size in MB
  max_processes: 10                # Maximum number of child processes
  network_enabled: false           # Enable/disable network access

# Security settings (duplicate for explicit configuration)
security:
  max_memory_mb: 512
  max_cpu_time: 30
  max_file_size_mb: 10
  max_processes: 10
  network_enabled: false

# Logging configuration
logging:
  level: INFO                      # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: null                       # Log file path (null = stdout)

# UI configuration
ui:
  theme: default                   # UI theme (default, dark, light)
  show_timings: true               # Show execution timings
  show_memory: true                # Show memory usage
  verbose: false                   # Verbose output mode

# Runtime configuration
runtime:
  working_directory: null          # Working directory (null = temp directory)
  environment:                     # Additional environment variables
    PYTHONUNBUFFERED: "1"
